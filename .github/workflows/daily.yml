name: Daily Lorcana update

on:
  schedule:
    - cron: "17 13 * * *"   # every day at 13:17 UTC (about 6:17 AM Denver time)
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = last 2 days, backfill = last 90 days (run once at the start)"
        default: "daily"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect new sales
        run: python collector/run.py ${{ github.event.inputs.mode || 'daily' }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Rebuild the dashboard data
        run: python collector/analyze.py
      - name: Save changes
        run: |
          git config user.name "lorcana-bot"
          git config user.email "lorcana-bot@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Update data $(date -u +%F)"
          git push
